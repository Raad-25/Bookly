<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="ستون ليلة — الليلة الأولى — السنة الأولى.">
<meta property="og:title" content="ستون ليلة — الليلة الأولى">
<meta property="og:description" content="لا أعرف متى بدأت. لا أعرف إن كان هناك يومٌ اسمه الأمس، ولا إن كان سيأتي يومٌ اسمه غداً.">
<meta property="og:type" content="website">
<title>ستون ليلة — الليلة الأولى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <a class="brand" href="./" aria-label="ستون ليلة">ستون <span>ليلة</span></a>
  <div class="top-actions">
    <button id="soundBtn" class="icon-btn" aria-label="صوت تقليب الصفحة">⌁</button>
    <button id="shareBtn" class="icon-btn" aria-label="مشاركة">↗</button>
  </div>
</header>

<main>
  <section class="hero" aria-label="غلاف الكتاب">
    <div class="moon"></div>
    <div class="hero-title-circle">
      <div class="hero-title">ستون<br><em>ليلة</em></div>
      <div class="hero-subtitle">رحلة عمر في ستين ليلة</div>
    </div>
    <div class="hero-copy">
      <p class="hero-line">كل ليلةٍ تعيدني سنةً إلى الوراء…<br>حتى أصل إلى الطفل الذي بدأ كل شيء.</p>
      <button id="startBtn" class="gold-btn">ابدأ القراءة <span>←</span></button>
    </div>
    <div class="night-mark">60<br><small>ليلة</small></div>
  </section>

  <section id="reader" class="reader-wrap" aria-label="قارئ الليلة الأولى">
    <div class="reader-head">
      <div>
        <span class="small-label">الليلة الأولى</span>
        <h2>السنة الأولى</h2>
      </div>
      <div class="counter" id="pageCounter">1 / 15</div>
    </div>

    <div class="progress"><span id="progressBar"></span></div>

    <article class="book" id="book" tabindex="0" aria-label="صفحات الليلة الأولى">
      <div class="story-page" id="storyPage"></div>
    </article>

    <div class="reader-controls">
      <button id="prevBtn" class="round-btn" disabled aria-label="السابق">→</button>
      <div class="page-dots" id="dots"></div>
      <button id="nextBtn" class="round-btn" aria-label="التالي">←</button>
    </div>
    <p class="hint">اضغط السهمين أو اسحب الصفحة يميناً ويساراً</p>
  </section>
</main>

<footer>
  <span>ستون ليلة</span>
  <span>رحلة إلى البداية</span>
</footer>

<script src="./app.js"></script>
</body>
</html>
